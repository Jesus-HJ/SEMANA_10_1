{% extends "base.html" %}

{% block title %}{{ error_title }}{% endblock %}

{% block content %}
<section class="error-section">
  <div class="container error-card">
    <h1>{{ error_title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Volver al inicio</a>
  </div>
</section>
{% endblock %}
